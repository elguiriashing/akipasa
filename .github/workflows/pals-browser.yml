name: AkiPals browser acceptance
on:
  pull_request:
    branches: [master]
    paths:
      - "src/app/pals/**"
      - "src/lib/pals/**"
      - "src/components/pals/**"
      - "tests/pals*.test.ts"
      - "vitest.pals.config.ts"
      - "scripts/test-pals-browser.mjs"
      - "scripts/test-pals-identity-browser.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pals-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pals-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run --config vitest.pals.config.ts
      - run: node scripts/test-pals-browser.mjs
      - run: npm run pals:3d:bundle
      - run: node scripts/test-pals-identity-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pals-browser-evidence
          path: |
            test-results/pals-browser
            test-results/pals-identity-browser
          retention-days: 7
