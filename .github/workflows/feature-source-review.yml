name: Feature source review
on:
  push:
    branches: [feat/official-events-venue-catalogues]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source for offline review
        run: git archive --format=tar HEAD | gzip > /tmp/akipasa-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: feature-source
          path: /tmp/akipasa-source.tar.gz
          retention-days: 1
