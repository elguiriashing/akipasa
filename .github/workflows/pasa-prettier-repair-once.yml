name: AkiPasa one-time shared UI formatting repair

on:
  push:
    branches: [design/pasa-radar-cinematic-overhaul-20261028]
    paths:
      - .github/workflows/pasa-prettier-repair-once.yml

permissions:
  contents: write

concurrency:
  group: pasa-prettier-repair
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Format only the four exact-head CI failures
        run: |
          npx prettier --write \
            src/components/AppShell.tsx \
            src/components/PasaSharedSurfaces.css \
            src/lib/pasa-surface-families.ts \
            tests/pasa-surface-families.test.ts
          npx prettier --check \
            src/components/AppShell.tsx \
            src/components/PasaSharedSurfaces.css \
            src/lib/pasa-surface-families.ts \
            tests/pasa-surface-families.test.ts
          git diff --check
      - name: Commit real formatting diff without force-pushing
        run: |
          if git diff --quiet -- \
            src/components/AppShell.tsx \
            src/components/PasaSharedSurfaces.css \
            src/lib/pasa-surface-families.ts \
            tests/pasa-surface-families.test.ts; then
            echo "All four files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/AppShell.tsx \
            src/components/PasaSharedSurfaces.css \
            src/lib/pasa-surface-families.ts \
            tests/pasa-surface-families.test.ts
          git commit -m "style(pasa): format the canonical shared route family"
          git push origin HEAD:design/pasa-radar-cinematic-overhaul-20261028
