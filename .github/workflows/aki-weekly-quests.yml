name: AkiPassport weekly-quest pilot
on:
  pull_request:
    paths:
      - "src/lib/aki-weekly-quests.ts"
      - "src/components/WeeklyQuestPanel.*"
      - "src/app/[locale]/passports/page.tsx"
      - "tests/aki-weekly-quests.test.ts"
      - ".github/workflows/aki-weekly-quests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Passport optional-week milestones
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check source formatting
        run: >
          npx prettier --check
          src/lib/aki-weekly-quests.ts
          src/components/WeeklyQuestPanel.tsx
          src/components/WeeklyQuestPanel.module.css
          "src/app/[locale]/passports/page.tsx"
          tests/aki-weekly-quests.test.ts
          docs/AKIPASSPORT_WEEKLY_QUEST_PILOT_20261029.md
      - name: Lint touched sources
        run: >
          npx eslint
          src/lib/aki-weekly-quests.ts
          src/components/WeeklyQuestPanel.tsx
          "src/app/[locale]/passports/page.tsx"
          tests/aki-weekly-quests.test.ts
          --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Verified check-in and week-boundary tests
        run: npx vitest run --environment node tests/aki-weekly-quests.test.ts
