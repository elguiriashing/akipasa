name: Temporary map media validation

on:
  push:
    branches:
      - fix/map-resize-and-card-media

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused tests
        run: npx vitest run --environment node tests/discovery.test.ts tests/map-snapshot.test.ts tests/map-browser-cache.test.ts
      - name: Production build
        run: npm run build
      - name: Cloudflare build
        run: npm run build:cloudflare
