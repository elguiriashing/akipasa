name: Format AkiSuite navigation PR
on:
  push:
    branches: ["fix/akisuite-navigation-actions-20261017"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/AppShell.tsx src/app/portal-unity.css
      - name: Commit formatting when needed
        run: |
          if git diff --quiet -- src/components/AppShell.tsx src/app/portal-unity.css; then exit 0; fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AppShell.tsx src/app/portal-unity.css
          git commit -m 'style: format AkiSuite navigation implementation'
          git push origin HEAD:fix/akisuite-navigation-actions-20261017
