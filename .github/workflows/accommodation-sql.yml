name: Accommodation PostgreSQL integration
on:
  pull_request:
    branches: [master]
    paths:
      - "supabase/migrations/*accommodation*.sql"
      - "scripts/test-accommodation-sql.mjs"
      - ".github/workflows/accommodation-sql.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-acceptance:
    runs-on: ubuntu-latest
    env:
      TEST_ACCOMMODATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/accommodation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Start isolated PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "alter user postgres password 'postgres'"
          sudo -u postgres createdb accommodation_test
      - run: node scripts/test-accommodation-sql.mjs
