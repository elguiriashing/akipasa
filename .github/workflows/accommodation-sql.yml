name: Accommodation PostgreSQL integration
on:
  pull_request:
    branches: [master]
    paths:
      - "supabase/migrations/*accommodation*.sql"
      - "scripts/test-accommodation-sql.mjs"
      - ".github/workflows/accommodation-sql.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accommodation_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d accommodation_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_ACCOMMODATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/accommodation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/test-accommodation-sql.mjs
