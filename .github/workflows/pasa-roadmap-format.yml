name: Format roadmap files on redesign branch

on:
  push:
    branches:
      - design/pasa-radar-cinematic-overhaul-20261028

permissions:
  contents: write

concurrency:
  group: pasa-roadmap-format
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/pasa-radar-cinematic-overhaul-20261028
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Normalize changed sources without modifying workflow files
        shell: bash
        run: |
          files=()
          while IFS= read -r -d '' file; do
            case "$file" in
              .github/workflows/*) ;;
              *.ts|*.tsx|*.css|*.mjs|*.md|*.json)
                if [ -f "$file" ]; then files+=("$file"); fi
                ;;
            esac
          done < <(git diff --name-only -z origin/master...HEAD)
          if (( ${#files[@]} > 0 )); then
            npx prettier --write "${files[@]}"
          fi
      - name: Commit normalized source
        shell: bash
        run: |
          git add -- docs package.json src scripts tests
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(roadmap): normalize public launch source"
            git fetch origin design/pasa-radar-cinematic-overhaul-20261028
            git rebase origin/design/pasa-radar-cinematic-overhaul-20261028
            git push origin HEAD:design/pasa-radar-cinematic-overhaul-20261028
          fi
