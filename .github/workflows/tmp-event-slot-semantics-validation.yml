name: Temporary event media semantics validation
# final slot wiring validation after resolver fix

on:
  push:
    branches:
      - fix/event-media-slot-semantics

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused tests
        run: npx vitest run --environment node tests/discovery.test.ts tests/venue-catalogue.test.ts tests/venue-dashboard.test.tsx tests/business-onboarding.test.ts
      - name: Production build
        run: npm run build
      - name: Cloudflare build
        run: npm run build:cloudflare
