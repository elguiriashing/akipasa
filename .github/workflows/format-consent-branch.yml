name: Format consent fix branch
on:
  push:
    branches:
      - fix/consent-gated-google-tags-20261008
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consent-gated-google-tags-20261008
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier
        run: npx prettier --write .
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply repository Prettier formatting"
          git push origin HEAD:fix/consent-gated-google-tags-20261008
