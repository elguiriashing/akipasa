name: Temporary booking UX formatter
on:
  push:
    branches: [feature/booking-ux-confirmations]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-ux-confirmations
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format booking files
        run: |
          npx prettier --write 'src/app/[locale]/business/venue/[id]/actions.ts' 'src/app/[locale]/business/venue/[id]/page.tsx' 'src/app/[locale]/venues/[slug]/book/page.tsx' 'src/app/[locale]/account/page.tsx' 'src/app/[locale]/account/layout.tsx' 'src/app/[locale]/account/bookings/page.tsx' src/components/BookingManager.tsx src/components/BookingWizard.tsx src/components/MyBookings.tsx src/lib/booking-confirmation-email.ts tests/booking-customer-experience.test.tsx src/app/globals.css docs/AKIPASA_MASTER.md docs/CHANGE_IMPACT_REGISTER.md
      - name: Commit formatting with safe rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app src/components/BookingManager.tsx src/components/BookingWizard.tsx src/components/MyBookings.tsx src/lib/booking-confirmation-email.ts tests/booking-customer-experience.test.tsx docs/AKIPASA_MASTER.md docs/CHANGE_IMPACT_REGISTER.md
          if ! git diff --cached --quiet; then
            git commit -m "style(bookings): format redesigned booking interfaces"
            git fetch origin feature/booking-ux-confirmations
            git rebase origin/feature/booking-ux-confirmations
            git push origin HEAD:feature/booking-ux-confirmations
          fi
