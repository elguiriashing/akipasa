name: Listing quota PostgreSQL races
on:
  pull_request:
    branches: [master]
    paths:
      - "supabase/migrations/*listing_quota_scope*.sql"
      - "supabase/migrations/*baseline_media_quota*.sql"
      - "scripts/test-listing-quota-concurrency.mjs"
      - "tests/fixtures/akisuite-premium-sql.ts"
      - ".github/workflows/listing-quota-sql.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  listing-quota-races:
    runs-on: ubuntu-latest
    env:
      TEST_LISTING_QUOTA_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/listing_quota_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Start isolated PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "alter user postgres password 'postgres'"
          sudo -u postgres createdb listing_quota_test
      - run: node --experimental-strip-types scripts/test-listing-quota-concurrency.mjs
