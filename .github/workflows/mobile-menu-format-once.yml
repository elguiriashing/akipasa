name: Format mobile menu fix once
on:
  push:
    branches: [fix/independent-mobile-suite-menu-20261017]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/AppShell.tsx src/app/portal-unity.css tests/workspace-shell.test.tsx tests/e2e/mobile-suite-separation.spec.ts
      - name: Commit canonical formatting if necessary
        run: |
          if git diff --quiet -- src/components/AppShell.tsx src/app/portal-unity.css tests/workspace-shell.test.tsx tests/e2e/mobile-suite-separation.spec.ts; then exit 0; fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AppShell.tsx src/app/portal-unity.css tests/workspace-shell.test.tsx tests/e2e/mobile-suite-separation.spec.ts
          git commit -m 'style: format independent mobile navigation'
          git push origin HEAD:fix/independent-mobile-suite-menu-20261017
