name: Integrate reviewed master into artwork fix
on:
  push:
    branches: [fix/discovery-card-transparency-20261101]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'elguiriashing/akipasa' && github.ref == 'refs/heads/fix/discovery-card-transparency-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Preserve reviewed master and append both change records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          test "$(git rev-parse origin/master)" = b8f87200ee2fb1fbd403939e6c71e841e568e339
          git merge --no-commit --no-ff origin/master || {
            python3 - <<'PY'
          import subprocess
          conflicts = set(subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines())
          allowed = {'docs/AKIPASA_MASTER.md', 'docs/CHANGE_IMPACT_REGISTER.md'}
          if not conflicts or not conflicts <= allowed:
              raise SystemExit('Unexpected merge conflict; refusing integration: ' + str(conflicts))
          PY
          }
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          note = Path('docs/DISCOVERY_CARD_ARTWORK_20261101.md').read_text()
          heading = note.splitlines()[0]
          for filename in ['docs/AKIPASA_MASTER.md', 'docs/CHANGE_IMPACT_REGISTER.md']:
              current = subprocess.check_output(['git', 'show', 'origin/master:' + filename], text=True)
              if heading not in current:
                  current = current.rstrip() + '\n\n' + note
              Path(filename).write_text(current)
          PY
          npx prettier --write docs/AKIPASA_MASTER.md docs/CHANGE_IMPACT_REGISTER.md
          git rm .github/workflows/card-artwork-integrate.yml
          git add docs/AKIPASA_MASTER.md docs/CHANGE_IMPACT_REGISTER.md
          git diff --cached --check
          git commit -m 'Merge reviewed dock/theme release without losing artwork fix'
          git push origin HEAD:fix/discovery-card-transparency-20261101
