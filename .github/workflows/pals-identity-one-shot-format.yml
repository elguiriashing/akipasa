name: AkiPals identity one-shot format
on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/pals-identity-one-shot-format.yml"
permissions:
  contents: write
jobs:
  format-identity:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/akipals-human-avatar-studio-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/lib/pals/avatar-v2.ts src/app/pals/identity/route.ts tests/pals-identity.test.ts scripts/test-pals-identity-browser.mjs
      - name: Commit formatting only if needed
        run: |
          git add src/lib/pals/avatar-v2.ts src/app/pals/identity/route.ts tests/pals-identity.test.ts scripts/test-pals-identity-browser.mjs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(pals): format identity studio implementation"
            git push origin HEAD:feature/akipals-human-avatar-studio-20261028
          fi
