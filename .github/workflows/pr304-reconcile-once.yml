name: Reconcile PR304 source once
on:
  push:
    branches: [security/pin-automation-node-20261027]
    paths: [.github/workflows/pr304-reconcile-once.yml]
permissions:
  contents: read
jobs:
  reconcile:
    if: github.repository == 'elguiriashing/akipasa'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Merge current master and preserve both documentation histories
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=security/pin-automation-node-20261027
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          git fetch origin master
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff origin/master || true
          python3 - <<'PY'
          import pathlib, subprocess
          def show(ref, path):
              return subprocess.check_output(['git', 'show', f'{ref}:{path}']).decode()
          titles = {
              'docs/AKIPASA_MASTER.md': '## 2026-10-27 | Automation Worker Node CI security baseline',
              'docs/CHANGE_IMPACT_REGISTER.md': '## 2026-10-27 | Automation Worker GitHub Actions Node runtime security baseline',
          }
          conflicts = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U']).decode().splitlines()
          if any(path not in titles for path in conflicts):
              raise SystemExit('Unreviewed conflict; no source push: ' + repr(conflicts))
          for path, title in titles.items():
              ours = show('HEAD', path)
              master = show('origin/master', path)
              start = ours.index(title)
              end = ours.find('\n## ', start + len(title))
              section = ours[start:end if end >= 0 else None].strip()
              if title in master:
                  raise SystemExit('Runtime entry already exists on master; review before retry')
              amended = master + '\n' + section + '\n'
              assert amended.startswith(master)
              pathlib.Path(path).write_text(amended)
          PY
          git add docs/AKIPASA_MASTER.md docs/CHANGE_IMPACT_REGISTER.md
          test -z "$(git diff --name-only --diff-filter=U)"
          node scripts/check-contract-document-integrity.mjs
          git diff --cached --check
          git commit -m 'Merge current master into PR304 preserving runtime notes and full contracts'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$branch"
