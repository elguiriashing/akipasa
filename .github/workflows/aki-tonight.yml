name: AkiTonight release slice
on:
  pull_request:
    paths:
      - "src/lib/aki-tonight.ts"
      - "src/app/[locale]/tonight/**"
      - "src/components/PlansFirstHero.tsx"
      - "tests/aki-tonight.test.ts"
      - ".github/workflows/aki-tonight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: AkiTonight isolated acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Capture canonical Prettier output for branch correction
        run: |
          npx prettier --write src/lib/aki-tonight.ts tests/aki-tonight.test.ts "src/app/[locale]/tonight/page.tsx" "src/app/[locale]/tonight/tonight.module.css"
          for file in src/lib/aki-tonight.ts tests/aki-tonight.test.ts "src/app/[locale]/tonight/page.tsx" "src/app/[locale]/tonight/tonight.module.css"; do
            echo "AKI_FORMAT_BEGIN:$file"
            base64 -w 0 "$file"
            echo ""
            echo "AKI_FORMAT_END:$file"
          done
      - name: Check source formatting
        run: >
          npx prettier --check
          src/lib/aki-tonight.ts
          tests/aki-tonight.test.ts
          "src/app/[locale]/tonight/page.tsx"
          "src/app/[locale]/tonight/tonight.module.css"
          src/components/PlansFirstHero.tsx
      - name: Check touched application files
        run: >
          npx eslint
          src/lib/aki-tonight.ts
          tests/aki-tonight.test.ts
          "src/app/[locale]/tonight/page.tsx"
          src/components/PlansFirstHero.tsx
          --max-warnings=0
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Verify real-event and midnight guardrails
        run: npx vitest run --environment node tests/aki-tonight.test.ts
