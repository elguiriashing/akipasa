name: Temporary booking engine formatter
on:
  push:
    branches:
      - feature/booking-engine-resources-schedules
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-engine-resources-schedules
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format touched files
        run: |
          npx prettier --write 'src/app/[locale]/business/venue/[id]/actions.ts' 'src/app/[locale]/business/venue/[id]/page.tsx' src/components/BookingManager.tsx tests/booking-manager.test.tsx src/app/globals.css docs/AKIPASA_MASTER.md docs/CHANGE_IMPACT_REGISTER.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/[locale]/business/venue/[id]/actions.ts' 'src/app/[locale]/business/venue/[id]/page.tsx' src/components/BookingManager.tsx tests/booking-manager.test.tsx src/app/globals.css docs/AKIPASA_MASTER.md docs/CHANGE_IMPACT_REGISTER.md
          if ! git diff --cached --quiet; then
            git commit -m "style(bookings): format advanced booking engine"
            git push origin HEAD:feature/booking-engine-resources-schedules
          fi
