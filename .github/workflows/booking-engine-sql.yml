name: Booking engine PostgreSQL integration
on:
  pull_request:
    branches: [master]
    paths:
      - 'supabase/migrations/*booking*.sql'
      - 'scripts/test-booking-engine-sql.mjs'
      - '.github/workflows/booking-engine-sql.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_BOOKING_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/booking_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run disposable database acceptance
        run: node scripts/test-booking-engine-sql.mjs
