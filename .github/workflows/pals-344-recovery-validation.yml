name: Validate AkiPals recovery fixes
on:
  push:
    branches: [work/akipals-344-source-20261101]
    paths: [.github/workflows/pals-344-recovery-validation.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 04386b2881589cb953f5a220564cbf590679ecfb
      - name: Apply hash-verified recovery changes to candidate only
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,subprocess
          from pathlib import Path
          payload=''
          raw=lzma.decompress(base64.b64decode(payload))
          assert hashlib.sha256(raw).hexdigest()=='e5c25910ec49243bbe3b5a1723c9920362d9594357d13e450677344214cdf9e1'
          entries=json.loads(raw)
          allowed={'src/components/pals/starter-style.js','src/components/pals/studio-3d.js','src/components/pals/WorldExplorer.module.css','scripts/test-pals-identity-browser.mjs'}
          assert len(entries)==4 and {e['p'] for e in entries}==allowed
          for e in entries:
              p=Path(e['p']);old=p.read_text();assert hashlib.sha256(old.encode()).hexdigest()==e['h']
              lines=old.splitlines(keepends=True)
              for i,j,text in reversed(e['e']): lines[i:j]=text.splitlines(keepends=True)
              new=''.join(lines);assert hashlib.sha256(new.encode()).hexdigest()==e['n'];p.write_text(new)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix(pals): keep texture sources stable and make World retry reachable'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/work/pals-344-recovery-fix-20261101'],check=True)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run pals:3d:bundle
      - name: Record exact candidate
        run: |
          mkdir -p test-results/pals-review
          git rev-parse HEAD >test-results/pals-review/source-sha.txt
          git archive --format=tar.gz --output=test-results/pals-review/source.tar.gz HEAD
      - name: World rendering and recovery
        id: world
        continue-on-error: true
        run: node scripts/test-pals-world-browser.mjs >test-results/pals-review/world.log 2>&1 || { tail -80 test-results/pals-review/world.log; exit 1; }
      - name: Wardrobe rendering and recovery
        id: wardrobe
        continue-on-error: true
        run: node scripts/test-pals-identity-browser.mjs >test-results/pals-review/wardrobe.log 2>&1 || { tail -80 test-results/pals-review/wardrobe.log; exit 1; }
      - name: Require both browser gates
        if: always()
        run: test '${{ steps.world.outcome }}' = 'success' && test '${{ steps.wardrobe.outcome }}' = 'success'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pals-344-recovery-evidence
          path: |
            test-results/pals-review
            test-results/pals-world-browser
            test-results/pals-identity-browser
          retention-days: 3
