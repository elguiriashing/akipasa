name: Prepare and verify private AkiPals preview
on:
  push:
    branches: [agent/akipals-secret-preview]
permissions:
  contents: write
concurrency:
  group: akipals-preview-build
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'elguiriashing/akipasa' && github.ref == 'refs/heads/agent/akipals-secret-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/akipals-secret-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix automation
      - name: Apply exact-source integration and format only preview changes
        run: |
          node scripts/prepare-pals-preview.mjs
          npx prettier --write src/lib/pals src/components/pals src/app/pals tests/pals.test.ts tests/pals-integration.test.ts "src/app/[locale]/map/page.tsx" src/lib/auth-security.ts src/lib/seo.ts src/middleware.ts package.json docs/akipals-preview.md
          rm scripts/prepare-pals-preview.mjs .github/workflows/pals-preview-build.yml
          git add src/lib/pals src/components/pals src/app/pals tests/pals.test.ts tests/pals-integration.test.ts "src/app/[locale]/map/page.tsx" src/lib/auth-security.ts src/lib/seo.ts src/middleware.ts package.json docs/akipals-preview.md
          git add -u scripts/prepare-pals-preview.mjs .github/workflows/pals-preview-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Integrate and format private preview; remove one-time preparation workflow"
          git push origin HEAD:agent/akipals-secret-preview
          git rev-parse HEAD
      - name: Verify repository contract
        run: npm run check
      - name: Verify Cloudflare production bundle
        run: npm run build:cloudflare
