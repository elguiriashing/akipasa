name: Booking browser acceptance
on:
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "scripts/test-booking-browser.mjs"
      - ".github/workflows/booking-browser.yml"
permissions:
  contents: read
jobs:
  booking-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:booking:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-browser-evidence
          path: test-results/booking-release
          retention-days: 7
  site-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-site-regression-evidence
          path: test-results
          retention-days: 7
