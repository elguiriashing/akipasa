name: Booking browser acceptance
on:
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "scripts/test-booking-browser.mjs"
      - ".github/workflows/booking-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  booking-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:booking:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-browser-evidence
          path: test-results/booking-release
          retention-days: 7
  site-regression:
    # The existing 63-case site suite needs a provisioned catalogue backend.
    # Its isolated localhost attempt timed out; this is not booking acceptance.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_DATA_PROVIDER: fixtures
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.BOOKING_STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.BOOKING_STAGING_SUPABASE_ANON_KEY }}
    steps:
      - name: Require an explicitly provisioned test backend
        run: test -n "$NEXT_PUBLIC_SUPABASE_URL" && test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-site-regression-evidence
          path: test-results
          retention-days: 7
