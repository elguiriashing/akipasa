name: Format desktop rail fix once
on:
  push:
    branches: [fix/rail-footer-viewport-20261017]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/portal-unity.css tests/e2e/rail-viewport.spec.ts
      - name: Commit canonical formatting if needed
        run: |
          if git diff --quiet -- src/app/portal-unity.css tests/e2e/rail-viewport.spec.ts; then exit 0; fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/portal-unity.css tests/e2e/rail-viewport.spec.ts
          git commit -m 'style: format AkiSuite viewport rail fix'
          git push origin HEAD:fix/rail-footer-viewport-20261017
