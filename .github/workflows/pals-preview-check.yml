name: Check private AkiPals release
on:
  push:
    branches: [agent/akipals-secret-preview]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'elguiriashing/akipasa' && github.ref == 'refs/heads/agent/akipals-secret-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/akipals-secret-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix automation
      - name: Rename reserved identifiers without changing text or game rules
        id: prepare
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const ts = require('typescript');
          const path = 'src/lib/pals/engine.ts';
          let source = fs.readFileSync(path, 'utf8');
          const hash = crypto.createHash('sha1').update(`blob ${Buffer.byteLength(source)}\0`).update(source).digest('hex');
          if (hash !== '77b4d0a7b285f074e695f9e94eb1878f590fd43a') throw new Error('Engine changed; review before applying identifier fix');
          const tree = ts.createSourceFile(path, source, ts.ScriptTarget.Latest, true);
          const edits = [];
          function visit(node) {
            if (ts.isIdentifier(node) && node.text === 'module') edits.push([node.getStart(tree), node.end]);
            ts.forEachChild(node, visit);
          }
          visit(tree);
          if (edits.length < 2 || edits.length > 10) throw new Error('Unexpected identifier set');
          for (const [start, end] of edits.sort((a,b) => b[0] - a[0])) source = source.slice(0,start) + 'fittedModule' + source.slice(end);
          fs.writeFileSync(path, source);
          console.log(`Renamed ${edits.length} identifier references; string literals unchanged.`);
          NODE
          npx prettier --write src/lib/pals/engine.ts
          rm .github/workflows/pals-preview-check.yml
          git add src/lib/pals/engine.ts
          git add -u .github/workflows/pals-preview-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Avoid reserved Next.js module variable in AkiPals engine"
          git push origin HEAD:agent/akipals-secret-preview
          git rev-parse HEAD
      - name: Formatting
        if: always() && steps.prepare.outcome == 'success'
        run: npm run format:check
      - name: Lint
        if: always() && steps.prepare.outcome == 'success'
        run: npm run lint
      - name: Typecheck
        if: always() && steps.prepare.outcome == 'success'
        run: npm run typecheck
      - name: Unit and integration tests
        if: always() && steps.prepare.outcome == 'success'
        run: npm test
      - name: Database safety checks
        if: always() && steps.prepare.outcome == 'success'
        run: npm run test:db-safety
      - name: Automation checks
        if: always() && steps.prepare.outcome == 'success'
        run: npm run automation:check
      - name: Production Next.js build
        if: always() && steps.prepare.outcome == 'success'
        run: npm run build
      - name: Production Cloudflare bundle
        if: always() && steps.prepare.outcome == 'success'
        run: npm run build:cloudflare
