name: Prepare October 2026 security lockfile
on:
  push:
    branches: [security/next-react-oct2026]
permissions:
  contents: write
jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate npm lockfile with patched dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirm patched resolved versions
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const expected = {
            'node_modules/next': '15.5.28',
            'node_modules/eslint-config-next': '15.5.28',
            'node_modules/react': '19.1.10',
            'node_modules/react-dom': '19.1.10'
          };
          for (const [name,version] of Object.entries(expected)) {
            const actual = lock.packages[name]?.version;
            if (actual !== version) throw new Error(name+' expected '+version+' but found '+actual);
            console.log(name + ': ' + actual);
          }
          NODE
      - name: Commit lockfile to security branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: refresh lockfile for patched Next.js and React"
            git push origin HEAD:security/next-react-oct2026
          fi
      - name: Verify deterministic dependency installation
        run: npm ci --no-audit --no-fund
