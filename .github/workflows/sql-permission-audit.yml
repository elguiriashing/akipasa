name: SQL migration permission audit

on:
  pull_request:
    paths:
      - "database/migrations/**.sql"
      - "supabase/migrations/**.sql"
      - "scripts/audit_sql_migration_permissions.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit changed table migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            mapfile -t FILES < <(git diff --diff-filter=ACMR --name-only "$BASE_SHA" HEAD -- 'database/migrations/*.sql' 'supabase/migrations/*.sql')
          else
            mapfile -t FILES < <(git ls-files 'database/migrations/*.sql' 'supabase/migrations/*.sql')
          fi
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No SQL migration changes"
            exit 0
          fi
          python3 scripts/audit_sql_migration_permissions.py "${FILES[@]}"
