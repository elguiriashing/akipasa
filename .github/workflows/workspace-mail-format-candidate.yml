name: Format Workspace mail candidate
on:
  push:
    branches:
      - feature/claim-mail-google-workspace-20261010
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[workspace-format-complete]')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/claim-mail-google-workspace-20261010
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write src/lib/workspace-claim-mail.ts src/lib/booking-mail-delivery.ts src/lib/claim-mail-delivery.ts docs/GOOGLE_WORKSPACE_MAIL_ROLLOUT.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/workspace-claim-mail.ts src/lib/booking-mail-delivery.ts src/lib/claim-mail-delivery.ts docs/GOOGLE_WORKSPACE_MAIL_ROLLOUT.md
          if ! git diff --cached --quiet; then
            git commit -m "Format Workspace email integration [workspace-format-complete]"
            git push origin HEAD:feature/claim-mail-google-workspace-20261010
          fi
