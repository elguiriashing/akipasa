name: Referral representative evidence acceptance
on:
  pull_request:
    branches: [master]
    paths:
      - "src/app/**/account/referrals/**"
      - "src/lib/referrals.ts"
      - "database/migrations/*referral_representative_evidence*"
      - "supabase/migrations/*referral_representative_evidence*"
      - "tests/akisuite-referral-representative*"
      - "scripts/test-referral-evidence-browser.mjs"
      - ".github/workflows/referral-evidence.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx vitest run --config vitest.akisuite.config.ts tests/akisuite-referral-representative-evidence.test.ts tests/akisuite-referral-representative-pages.test.tsx
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-referral-evidence-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: referral-representative-evidence
          path: test-results/referral-evidence
