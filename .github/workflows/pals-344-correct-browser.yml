name: Prepare AkiPals recovery browser correction
on:
  push:
    branches: [work/akipals-344-source-20261101]
    paths: [.github/workflows/pals-344-correct-browser.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0daae02e57deb0278a68e84a63ccad8f80808836
      - name: Apply exact reviewed test correction to a candidate ref
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,subprocess
          from pathlib import Path
          payload=''
          raw=lzma.decompress(base64.b64decode(payload))
          assert hashlib.sha256(raw).hexdigest()=='ddadd8171c64f9ef3baff8a5310722dbecb181a2b107947f246bb01bfba0ca9e'
          entries=json.loads(raw)
          allowed={'scripts/test-pals-world-browser.mjs','scripts/test-pals-identity-browser.mjs'}
          assert {e['p'] for e in entries}==allowed and len(entries)==2
          for e in entries:
              p=Path(e['p']);old=p.read_text()
              assert hashlib.sha256(old.encode()).hexdigest()==e['h']
              lines=old.splitlines(keepends=True)
              for i,j,text in reversed(e['e']): lines[i:j]=text.splitlines(keepends=True)
              new=''.join(lines);assert hashlib.sha256(new.encode()).hexdigest()==e['n']
              p.write_text(new)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','test(pals): assert neutral World retry and isolate page lifecycle recovery'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/work/pals-344-browser-correction-20261101'],check=True)
          print('CANDIDATE='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          PY
