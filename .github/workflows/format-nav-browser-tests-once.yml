name: Format AkiSuite browser fixture adapters
on:
  push:
    branches: ["fix/akisuite-navigation-actions-20261017"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/test-stay-ui-upgrades-browser.mjs scripts/test-portal-home-browser.mjs
      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- scripts/test-stay-ui-upgrades-browser.mjs scripts/test-portal-home-browser.mjs; then exit 0; fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-stay-ui-upgrades-browser.mjs scripts/test-portal-home-browser.mjs
          git commit -m 'style: format AkiSuite browser action mocks'
          git push origin HEAD:fix/akisuite-navigation-actions-20261017
