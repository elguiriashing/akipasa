name: Prepare PR325 validation once
on:
  push:
    branches: [feat/verified-waitlist-founder-notices-20261028]
    paths: [.github/workflows/pr325-stage-once.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'elguiriashing/akipasa'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Reconcile and stage reviewed tests without enabling sending
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=feat/verified-waitlist-founder-notices-20261028
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          git merge --no-commit --no-ff origin/master || true
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          def show(ref, path):
              return subprocess.check_output(['git', 'show', f'{ref}:{path}']).decode()
          docs = ['docs/AKIPASA_MASTER.md', 'docs/CHANGE_IMPACT_REGISTER.md']
          conflicts = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U']).decode().splitlines()
          if any(path not in docs for path in conflicts):
              raise SystemExit('Unexpected conflict; manual review required: ' + repr(conflicts))
          for path in docs:
              ours = show('HEAD', path)
              master = show('origin/master', path)
              title = '## 2026-10-28 | Verified launch waitlist founder notifications'
              start = ours.index(title)
              end = ours.find('\n## ', start + len(title))
              section = ours[start:end if end >= 0 else None].strip()
              if title in master:
                  raise SystemExit('Notice entry already merged; review required')
              Path(path).write_text(master + '\n' + section + '\n')
          route = Path('src/app/api/launch-waitlist/confirm/route.ts')
          value = route.read_text()
          old = '  if (data) {'
          assert value.count(old) == 1
          route.write_text(value.replace(old, '  if (data && process.env.LAUNCH_WAITLIST_FOUNDER_NOTICES_ENABLED === "true") {'))
          package = Path('package.json')
          value = json.loads(package.read_text())
          old = 'tests/launch-waitlist-route.test.ts '
          new = old + 'tests/launch-waitlist-founder-notice.test.ts tests/launch-waitlist-confirm.test.ts '
          assert value['scripts']['test'].count(old) == 1
          assert 'launch-waitlist-confirm.test.ts' not in value['scripts']['test']
          value['scripts']['test'] = value['scripts']['test'].replace(old, new)
          package.write_text(json.dumps(value, indent=2) + '\n')
          tests = Path('tests/launch-waitlist-confirm.test.ts')
          tests.write_text(tests.read_text() + '''
          it("keeps founder mail disabled without the exact activation value", async () => {
            for (const value of ["", "false", "TRUE", "1"]) {
              vi.stubEnv("LAUNCH_WAITLIST_FOUNDER_NOTICES_ENABLED", value);
              expect(status(await POST(request()))).toBe("confirmed");
            }
            expect(db.notice).not.toHaveBeenCalled();
          });
          ''')
          section = '''
          ## 2026-10-29 | Verified waitlist notice acceptance and launch boundary

          Founder notices require the exact server-only `LAUNCH_WAITLIST_FOUNDER_NOTICES_ENABLED=true` setting. Missing or malformed values leave existing email confirmation operational without sending founder mail. The release does not enable this setting, send test or customer email, or replay older confirmations. Tests are registered in the main `npm test` command and exercise the first atomic token consumption, expired/replayed proof, missing storage, malformed requests and provider rejection/timeout. Verified subscriber consent is never rolled back to retry a notice. Delivery is best effort after confirmation, not a durable outbox or a guaranteed delivery promise; failed or gated-off historical notices are not automatically replayed. A controlled signup and actual provider delivery acceptance are required before separately authorizing activation. No schema, billing, public data exposure or production configuration change. Cleanup tracker: #330.
          '''
          for path in docs:
              p = Path(path)
              p.write_text(p.read_text() + '\n' + section.strip() + '\n')
          PY
          git add docs/AKIPASA_MASTER.md docs/CHANGE_IMPACT_REGISTER.md
          test -z "$(git diff --name-only --diff-filter=U)"
      - run: npm ci --no-audit --no-fund
      - name: Format and validate confirmed-email boundaries
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          npx prettier --write src/app/api/launch-waitlist/confirm/route.ts src/lib/launch-waitlist-founder-notice.ts tests/launch-waitlist-founder-notice.test.ts tests/launch-waitlist-confirm.test.ts package.json docs/AKIPASA_MASTER.md docs/CHANGE_IMPACT_REGISTER.md
          node scripts/check-contract-document-integrity.mjs
          npx vitest run --environment node tests/launch-waitlist.test.ts tests/launch-waitlist-route.test.ts tests/launch-waitlist-founder-notice.test.ts tests/launch-waitlist-confirm.test.ts
          git add src/app/api/launch-waitlist/confirm/route.ts src/lib/launch-waitlist-founder-notice.ts tests/launch-waitlist-founder-notice.test.ts tests/launch-waitlist-confirm.test.ts package.json docs/AKIPASA_MASTER.md docs/CHANGE_IMPACT_REGISTER.md
          git diff --cached --check
          git commit -m 'Validate gated founder notices and preserve current master contracts'
          branch=feat/verified-waitlist-founder-notices-20261028
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$branch"
