name: Apply booking release acceptance fixes
on:
  push:
    branches: [feature/booking-ux-confirmations]
    paths: [.github/workflows/booking-release-final-fixes.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-ux-confirmations
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply regression fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/test-booking-engine-sql.mjs'); s=p.read_text(); a=s.index('  for (const file of ['); b=s.index('\n  check(',a); part=s[a:b].replace('await sql.unsafe(', 'await migrationSql.unsafe(')
          s=s[:a]+'  const migrationSql = postgres(connection, { max: 1, onnotice: () => {} });\n  try {\n'+part+'\n  } finally { await migrationSql.end(); }\n'+s[b:]; p.write_text(s)
          p=Path('src/components/BookingWizard.tsx'); s=p.read_text(); old='onClick={() => setStep((n) => n + 1)}'; assert old in s
          s=s.replace(old,'onClick={(event) => { event.preventDefault(); setStep((n) => n + 1); }}').replace('{step < 2 ? (\n            <button\n','{step < 2 ? (\n            <button\n              key="continue"\n').replace('            <button\n              type="submit"\n              form="customer-booking-form"','            <button\n              key="submit"\n              type="submit"\n              form="customer-booking-form"'); p.write_text(s)
          p=Path('scripts/test-booking-browser.mjs'); s=p.read_text(); s=s.replace('const errors = [];','const errors = [];\n        const diagnostic = async () => {\n          await page.screenshot({path:resolve(dir,`failure-${locale}-${width}-${theme}.png`),fullPage:true}).catch(()=>{});\n          writeFileSync(resolve(dir,`failure-${locale}-${width}-${theme}.html`),await page.content().catch(()=>""));\n          console.error(JSON.stringify({errors,buttons:await page.locator("button").allTextContents()}));\n        };')
          old='        await page\n          .getByRole("button", {\n            name: locale === "es" ? "Solicitar reserva" : "Request booking",\n          })\n          .click();'; assert old in s
          s=s.replace(old,old[:-1]+'.catch(async error => { await diagnostic(); throw error; });'); p.write_text(s)
          PY
          npx prettier --write scripts/test-booking-engine-sql.mjs scripts/test-booking-browser.mjs src/components/BookingWizard.tsx
          git add scripts/test-booking-engine-sql.mjs scripts/test-booking-browser.mjs src/components/BookingWizard.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(bookings): stop premature browser submit and safely apply transactional test migrations"
          git push origin HEAD:feature/booking-ux-confirmations
