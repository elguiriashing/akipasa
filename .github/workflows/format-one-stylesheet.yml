name: Final stylesheet format
on:
  pull_request:
    branches:
      - master
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consent-gated-google-tags-20261008
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format and validate stylesheet
        run: |
          npx prettier --write src/app/globals.css
          npx prettier --check src/app/globals.css
      - name: Commit stylesheet formatting
        run: |
          if git diff --quiet -- src/app/globals.css; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/globals.css
          git commit -m "style: finalize global stylesheet formatting"
          git push origin HEAD:fix/consent-gated-google-tags-20261008
