name: AkiPasa full visual release gate

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  visual-acceptance:
    if: github.head_ref == 'design/pasa-radar-cinematic-overhaul-20261028'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require every redesign route to have real acceptance
        run: npm run release:pasa-audit
