name: AkiPals focused World diagnostics
on:
  push:
    branches: [release/akipals-world-private-20261031]
    paths:
      - ".github/workflows/pals-world-diagnostics.yml"
      - "src/components/pals/WorldExplorer*"
      - "src/components/pals/studio-3d.js"
      - "scripts/test-pals-world-browser.mjs"
permissions:
  contents: read
jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Locked dependencies and Chromium
        run: |
          mkdir -p test-results/pals-world-diagnostics
          npm ci --no-audit --no-fund >/tmp/install.log 2>&1 || { tail -50 /tmp/install.log; exit 1; }
          npx playwright install --with-deps chromium >/tmp/chromium.log 2>&1 || { tail -50 /tmp/chromium.log; exit 1; }
      - run: npm run pals:3d:bundle
      - name: Actual World component browser checks
        run: |
          set +e
          node --input-type=module >test-results/pals-world-diagnostics/world.log 2>&1 <<'NODE'
          import { chromium } from '@playwright/test';
          import { writeFileSync } from 'node:fs';
          const launch = chromium.launch.bind(chromium);
          chromium.launch = async (...args) => {
            const browser = await launch(...args);
            const newContext = browser.newContext.bind(browser);
            browser.newContext = async (...args) => {
              const context = await newContext(...args);
              context.on('page', page => {
                page.on('pageerror', error => console.error('BROWSER EXCEPTION:',error.stack));
                page.on('console', event => { if(event.type()==='error') console.error('BROWSER CONSOLE:',event.text().slice(0,1500)); });
                page.on('requestfailed', request => console.error('FAILED REQUEST:', request.url(), request.failure()));
              });
              return context;
            };
            const close = browser.close.bind(browser);
            browser.close = async (...args) => {
              for(const [index,page] of browser.contexts().flatMap(c=>c.pages()).entries()) {
                try {
                  writeFileSync('test-results/pals-world-diagnostics/last-page-'+index+'.html', await page.content());
                  await page.screenshot({path:'test-results/pals-world-diagnostics/last-page-'+index+'.png',fullPage:true});
                } catch {}
              }
              return close(...args);
            };
            return browser;
          };
          await import('./scripts/test-pals-world-browser.mjs');
          NODE
          result=$?
          tail -100 test-results/pals-world-diagnostics/world.log
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pals-world-diagnostics
          path: |
            test-results/pals-world-diagnostics
            test-results/pals-world-browser
          retention-days: 3
