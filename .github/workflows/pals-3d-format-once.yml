name: One-shot AkiPals 3D source formatting
on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/pals-3d-format-once.yml"
permissions:
  contents: write
jobs:
  format-pals-3d:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/akipals-human-avatar-studio-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prettier exact new sources
        run: npx prettier --write src/components/pals/studio-3d.js src/components/pals/identity-preview.ts src/lib/pals/avatar-v2.ts src/app/pals/identity/route.ts scripts/build-pals-3d.mjs scripts/test-pals-identity-browser.mjs tests/pals-3d-assets.test.ts docs/AKIPALS_IDENTITY_V2_20261028.md public/pals/models/ASSET-LICENSE.md package.json package-lock.json
      - name: Commit only when required
        run: |
          git add src/components/pals/studio-3d.js src/components/pals/identity-preview.ts src/lib/pals/avatar-v2.ts src/app/pals/identity/route.ts scripts/build-pals-3d.mjs scripts/test-pals-identity-browser.mjs tests/pals-3d-assets.test.ts docs/AKIPALS_IDENTITY_V2_20261028.md public/pals/models/ASSET-LICENSE.md package.json package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(pals): format new 3D studio and tests"
            git push origin HEAD:feature/akipals-human-avatar-studio-20261028
          fi
