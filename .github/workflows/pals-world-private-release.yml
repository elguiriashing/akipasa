name: AkiPals private World release acceptance
on:
  push:
    branches: [release/akipals-world-private-20261031]
  pull_request:
    branches: [master]
    paths:
      - "src/app/pals/**"
      - "src/components/pals/**"
      - "src/lib/pals/**"
      - "public/pals/models/**"
      - "scripts/*pals*"
      - "tests/pals*"
      - ".github/workflows/pals-world-private-release.yml"
permissions:
  contents: read
concurrency:
  group: pals-private-world-${{ github.ref }}
  cancel-in-progress: false
jobs:
  assemble:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Prepare scoped source once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/prepare-pals-world-private.mjs')
          s = p.read_text()
          start = s.index('const change = ')
          end = s.index('const pkg = ', start)
          s = s[:start] + r'''const change = (p, before, after) => {
            const text = read(p);
            const escaped = before.trim().split("\n").map(line => line.trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("[ \\t]*\\n[ \\t]*");
            const pattern = new RegExp(escaped, "m");
            assert.ok(pattern.test(text), `Expected pinned source insertion: ${p}: ${before.slice(0, 70)}`);
            save(p, text.replace(pattern, () => after.trim()));
          };
          ''' + s[end:]
          p.write_text(s)
          PY
          node scripts/prepare-pals-world-private.mjs
      - run: npm ci --no-audit --no-fund
      - name: Format only scoped candidate changes
        run: |
          git diff --name-only 76cb96df21bf9404d50db373cf57bb0287fd9a80 | grep -E '\.(ts|tsx|js|mjs|css|md|yml|json)$' | xargs -r npx prettier --write
      - name: Save prepared source with a fast-forward-only push
        run: |
          git add src/app/pals src/components/pals src/lib/pals public/pals/models scripts/*pals* tests/pals* package.json package-lock.json next.config.ts .gitignore docs .github/workflows/pals-world-private-release.yml database/migrations/20261028235830_pals_human_avatar_profiles.sql
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat(pals): integrate restricted World and Wardrobe with production baseline"
            git push origin HEAD:release/akipals-world-private-20261031
          fi
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  acceptance:
    needs: [assemble]
    if: always() && (github.event_name == 'pull_request' || needs.assemble.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assemble.outputs.source || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix automation --no-audit --no-fund
      - name: Complete source checks and production build
        run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Real Wardrobe and World WebGL browser acceptance
        run: npm run test:pals:browser
      - name: Cloudflare exact-source packaging
        run: npm run build:cloudflare
      - name: Export source-bound review evidence
        if: always()
        run: |
          mkdir -p test-results/pals-release
          git rev-parse HEAD > test-results/pals-release/source-sha.txt
          git diff --stat 76cb96df21bf9404d50db373cf57bb0287fd9a80 > test-results/pals-release/scope.txt
          git archive --format=tar.gz --output=test-results/pals-release/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pals-private-world-acceptance
          path: |
            test-results/pals-release
            test-results/pals-identity-browser
            test-results/pals-world-browser
            test-results/pals-browser
          retention-days: 3
