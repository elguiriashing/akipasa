name: Booking live release smoke
on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/booking-live-smoke.yml"
      - "scripts/test-booking-live-evidence.py"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "custom-worker.ts"
      - "wrangler.jsonc"
      - ".github/workflows/booking-live-smoke.yml"
      - "scripts/test-booking-live-evidence.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: booking-live-release-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/test-booking-live-evidence.py
  live-read-only:
    if: github.event_name != 'pull_request'
    needs: evidence-contract
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Inspect live booking feature marker and public routes
        run: |
          python - <<'PY'
          import json,time,urllib.request,urllib.error,urllib.parse
          from pathlib import Path
          expected='2026-10-09-booking-ux-r1'
          evidence={'requested_source_commit':'${{ github.sha }}','deployed_source_commit':None,'deployment_source_verified':False,'deployment_source_limitation':'The static booking marker cannot identify the deployed source commit.','checks':[],'authenticated_production_test':'not performed; no browser session or credentials'}
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'AkiPasa-release-smoke/1.0','Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      return r.status,r.geturl(),r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  return e.code,url,e.read().decode('utf-8','replace')
              except Exception as e:
                  return 0,url,str(e)
          markers=['https://akipasa.com/api/bookings/release','https://business.akipasa.com/api/bookings/release']
          deadline=time.time()+12*60
          ready=False
          while time.time()<deadline:
              sample=[]
              for url in markers:
                  code,final,body=get(url+'?releaseCheck='+str(int(time.time())))
                  try: release=json.loads(body).get('release')
                  except Exception: release=None
                  sample.append({'url':url,'http_status':code,'release':release})
              print(json.dumps(sample),flush=True)
              if all(x['http_status']==200 and x['release']==expected for x in sample):
                  evidence['checks']+=sample; ready=True; break
              time.sleep(30)
          evidence['feature_release_verified']=ready
          urls=['https://akipasa.com/en','https://akipasa.com/es','https://www.akipasa.com/en','https://akipasa.com/en/venues/beasty-bites-004b87','https://akipasa.com/es/venues/beasty-bites-004b87','https://akipasa.com/en/account/bookings','https://akipasa.com/es/account/bookings','https://akipasa.com/en/venues/beasty-bites-004b87/book','https://akipasa.com/es/venues/beasty-bites-004b87/book','https://business.akipasa.com/en/auth']
          for url in urls:
              code,final,body=get(url)
              protected='/account/bookings' in url or urllib.parse.urlparse(url).path.endswith('/book')
              final_path=urllib.parse.urlparse(final).path.rstrip('/')
              healthy=code==200 and (not protected or final_path in ('/en/auth','/es/auth'))
              evidence['checks'].append({'url':url,'http_status':code,'final_url':final,'healthy':healthy})
          Path('booking-live-evidence.json').write_text(json.dumps(evidence,indent=2))
          print(json.dumps(evidence,indent=2))
          if not ready or any(x.get('healthy') is False for x in evidence['checks']):
              raise SystemExit('Live booking feature or public-route verification incomplete. Source deployment and authenticated acceptance remain unverified.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-live-evidence
          path: booking-live-evidence.json
          retention-days: 7
