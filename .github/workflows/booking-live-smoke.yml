name: Booking live release smoke
on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "custom-worker.ts"
      - "wrangler.jsonc"
      - ".github/workflows/booking-live-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: booking-live-release-smoke
  cancel-in-progress: true
jobs:
  live-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Wait for connected deployment and inspect public routes
        run: |
          python - <<'PY'
          import json,time,urllib.request,urllib.error
          from pathlib import Path
          expected='2026-10-09-booking-ux-r1'
          evidence={'source_commit':'${{ github.sha }}','checks':[],'authenticated_production_test':'not performed; no browser session or credentials'}
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'AkiPasa-release-smoke/1.0','Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      return r.status,r.geturl(),r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  return e.code,url,e.read().decode('utf-8','replace')
              except Exception as e:
                  return 0,url,str(e)
          markers=['https://akipasa.com/api/bookings/release','https://business.akipasa.com/api/bookings/release']
          deadline=time.time()+12*60
          ready=False
          while time.time()<deadline:
              sample=[]
              for url in markers:
                  code,final,body=get(url+'?releaseCheck='+str(int(time.time())))
                  try: release=json.loads(body).get('release')
                  except Exception: release=None
                  sample.append({'url':url,'http_status':code,'release':release})
              print(json.dumps(sample),flush=True)
              if all(x['http_status']==200 and x['release']==expected for x in sample):
                  evidence['checks']+=sample; ready=True; break
              time.sleep(30)
          evidence['edge_release_verified']=ready
          urls=['https://akipasa.com/en','https://akipasa.com/es','https://www.akipasa.com/en','https://akipasa.com/en/venues/beasty-bites-004b87','https://akipasa.com/es/venues/beasty-bites-004b87','https://akipasa.com/en/account/bookings','https://akipasa.com/es/account/bookings','https://business.akipasa.com/en/login']
          for url in urls:
              code,final,body=get(url)
              protected='/account/bookings' in url
              healthy=code==200 and (not protected or '/login' in final or '/signin' in final)
              evidence['checks'].append({'url':url,'http_status':code,'final_url':final,'healthy':healthy})
          Path('booking-live-evidence.json').write_text(json.dumps(evidence,indent=2))
          print(json.dumps(evidence,indent=2))
          if not ready or any(x.get('healthy') is False for x in evidence['checks']):
              raise SystemExit('Live release or public-route verification incomplete. Do not claim production acceptance.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-live-evidence
          path: booking-live-evidence.json
          retention-days: 7
