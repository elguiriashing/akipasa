name: Android Play bundle validation

on:
  pull_request:
    paths:
      - 'Android/**'
      - '.github/workflows/android-play-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate and build release bundle
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon test lint bundleRelease
      - name: Upload unsigned bundle for validation
        uses: actions/upload-artifact@v4
        with:
          name: akipasa-v2-unsigned-aab
          path: Android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
