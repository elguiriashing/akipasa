name: Android Play bundle validation

on:
  pull_request:
    paths:
      - 'Android/**'
      - '.github/workflows/android-play-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner already includes Android SDK command-line tools.
      # Avoid setup-android@v3: it attempts to install removed SDK package 'tools'.
      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          test -x "$SDKMANAGER" || { echo "Android sdkmanager is missing"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate and build release bundle
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon test lint bundleRelease
      - name: Upload unsigned bundle for validation
        uses: actions/upload-artifact@v4
        with:
          name: akipasa-v2-unsigned-aab
          path: Android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
