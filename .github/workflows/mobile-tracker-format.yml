name: Temporary AkiSuite release tracker formatter
on:
  pull_request:
    paths:
      - "mobile/SUITE-RELEASE-TRACKER.md"
      - ".github/workflows/mobile-tracker-format.yml"
permissions:
  contents: write
jobs:
  format-tracker:
    if: github.head_ref == 'feature/mobile-store-release-preparation-20261017' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-store-release-preparation-20261017
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write mobile/SUITE-RELEASE-TRACKER.md
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/SUITE-RELEASE-TRACKER.md
          if ! git diff --cached --quiet; then
            git commit -m 'style(mobile): format suite release tracker'
            git push origin HEAD:feature/mobile-store-release-preparation-20261017
          fi
