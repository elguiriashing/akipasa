name: Verify public AkiSuite app
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix automation
      - name: Generate exact Prettier output for review
        run: |
          npx prettier --write 'src/app/[locale]/business/actions.ts' 'src/app/[locale]/venues/[slug]/page.tsx' src/components/BusinessEventCatalogue.tsx src/components/BusinessEventComposer.tsx
          node -e 'const fs=require("fs");for(const p of ["src/app/[locale]/business/actions.ts","src/app/[locale]/venues/[slug]/page.tsx","src/components/BusinessEventCatalogue.tsx","src/components/BusinessEventComposer.tsx"]){const b=fs.readFileSync(p).toString("base64");for(let i=0;i<b.length;i+=2000)console.log("FMTFILE|"+p+"|"+Math.floor(i/2000)+"|"+b.slice(i,i+2000));}'
      - run: npm run check
      - run: npm run build:cloudflare
