name: Verify public AkiSuite app
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck catalogue studio
        run: npm run typecheck
      - name: Focused catalogue tests
        run: npx vitest run --environment node tests/venue-catalogue.test.ts tests/venue-dashboard.test.tsx
      - name: Cloudflare build
        run: npm run build:cloudflare
