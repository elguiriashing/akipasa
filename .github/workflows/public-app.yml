name: Verify public AkiSuite app
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix automation
      - run: npm run lint && npm run typecheck && npx vitest run --environment node tests/venue-dashboard.test.tsx tests/business-onboarding.test.ts tests/business-release.test.ts tests/venue-catalogue.test.ts && npm run build
      - run: npm run build:cloudflare
      - run: npm run format:check
