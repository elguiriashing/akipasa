name: Format booking branch
on:
  push:
    branches:
      - feature/akibusiness-bookings-v2
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/akibusiness-bookings-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format touched files
        run: |
          npx prettier --write 'src/app/[locale]/business/venue/[id]/actions.ts' 'src/app/[locale]/venues/[slug]/book/actions.ts' 'src/app/[locale]/venues/[slug]/book/page.tsx' 'src/app/[locale]/venues/[slug]/page.tsx' src/app/globals.css src/components/BookingManager.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app src/components/BookingManager.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(bookings): apply repository prettier formatting"
            git push origin HEAD:feature/akibusiness-bookings-v2
          fi
