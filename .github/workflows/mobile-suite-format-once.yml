name: Format split mobile navigation once
on:
  push:
    branches: [fix/separate-mobile-suite-and-more-20261017]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/AppShell.tsx src/app/portal-unity.css tests/e2e/discovery.spec.ts
      - name: Commit canonical formatting
        run: |
          if git diff --quiet -- src/components/AppShell.tsx src/app/portal-unity.css tests/e2e/discovery.spec.ts; then exit 0; fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AppShell.tsx src/app/portal-unity.css tests/e2e/discovery.spec.ts
          git commit -m 'style: format split mobile navigation'
          git fetch origin fix/separate-mobile-suite-and-more-20261017
          git rebase origin/fix/separate-mobile-suite-and-more-20261017
          git push origin HEAD:fix/separate-mobile-suite-and-more-20261017
