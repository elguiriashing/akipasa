name: AkiPasa contract gate
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Source inventory summary
        run: node scripts/generate-system-inventory.mjs --summary > source-inventory.json
      - name: Check impact documentation for application changes
        env:
          AKIPASA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-change-contract.mjs
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: akipasa-source-inventory
          path: source-inventory.json
          retention-days: 30
