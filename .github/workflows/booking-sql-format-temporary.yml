name: Temporary booking SQL formatter
on:
  push:
    branches:
      - feature/booking-engine-resources-schedules
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-engine-resources-schedules
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format SQL harness and workflow
        run: |
          npx prettier --write scripts/test-booking-engine-sql.mjs
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-booking-engine-sql.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(bookings): format SQL smoke suite"
            git push origin HEAD:feature/booking-engine-resources-schedules
          fi
