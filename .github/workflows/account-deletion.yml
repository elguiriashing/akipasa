name: Account deletion safety
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  deletion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/account-deletion-workflow.test.mjs
      - run: npx vitest run --environment node tests/account-deletion-execution.test.ts
