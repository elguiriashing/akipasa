name: Format AkiPasa redesign branch
on:
  push:
    branches:
      - design/pasa-radar-cinematic-overhaul-20261028
permissions:
  contents: write
concurrency:
  group: pasa-redesign-formatter
  cancel-in-progress: false
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: design/pasa-radar-cinematic-overhaul-20261028
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format every changed source and contract file
        shell: bash
        run: |
          files=()
          while IFS= read -r -d '' file; do
            case "$file" in
              *.ts|*.tsx|*.css|*.mjs|*.md|*.json|*.yml|*.yaml)
                if [ -f "$file" ]; then files+=("$file"); fi
                ;;
            esac
          done < <(git diff --name-only -z origin/master...HEAD)
          if (( ${#files[@]} > 0 )); then
            npx prettier --write "${files[@]}"
          fi
      - name: Commit formatting only
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style(pasa): autoformat redesign branch [skip ci]"
            git push origin HEAD:design/pasa-radar-cinematic-overhaul-20261028
          fi
