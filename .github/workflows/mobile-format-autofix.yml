name: Temporary mobile PR formatter
on:
  pull_request:
    paths:
      - mobile/**
      - .github/workflows/mobile-format-autofix.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format-release-files:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/mobile-store-release-preparation-20261017' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-store-release-preparation-20261017
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write mobile/store-release.json mobile/validate-store-release.mjs mobile/generate-associations.mjs .github/workflows/mobile-store-preflight.yml
      - name: Commit formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/store-release.json mobile/validate-store-release.mjs mobile/generate-associations.mjs .github/workflows/mobile-store-preflight.yml
          if ! git diff --cached --quiet; then
            git commit -m 'style(mobile): apply repository Prettier formatting'
            git push origin HEAD:feature/mobile-store-release-preparation-20261017
          fi
