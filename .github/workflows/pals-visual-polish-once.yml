name: One-shot AkiPals 3D visual code formatter
on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/pals-visual-polish-once.yml"
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/akipals-human-avatar-studio-20261028' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/components/pals/studio-3d.js scripts/test-pals-identity-browser.mjs
      - name: Commit if changed
        run: |
          git add src/components/pals/studio-3d.js scripts/test-pals-identity-browser.mjs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(pals): format improved 3D mannequin pose and browser evidence"
            git push origin HEAD:feature/akipals-human-avatar-studio-20261028
          fi
