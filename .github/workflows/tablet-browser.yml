name: AkiSuite tablet acceptance
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tablet-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PW_TEST_SCREENSHOT_NO_FONTS_READY: "1"
      NEXT_PUBLIC_DATA_PROVIDER: fixtures
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3999
      NEXT_PUBLIC_SUPABASE_ANON_KEY: tablet-local-disposable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chrome
      - run: node scripts/test-portal-home-browser.mjs
      - run: npm run build
      - run: npx playwright test tests/e2e/tablet-suite.spec.ts --workers=1
      - run: npx playwright test tests/e2e/akiduermo-consumer.spec.ts --workers=1
      - run: node scripts/test-tablet-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tablet-browser-evidence
          path: test-results
          retention-days: 7
