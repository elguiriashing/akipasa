name: Format master documentation PR
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Format documentation and scripts
        run: npx prettier --write --no-error-on-unmatched-pattern AGENTS.md docs/AKIPASA_MASTER.md docs/CHANGE_IMPACT_REGISTER.md docs/SOURCE_ROUTE_BASELINE.md scripts/generate-system-inventory.mjs scripts/check-change-contract.mjs src/components/VenueMediaStudio.tsx docs/AKISUITE_PRICING_ROLLOUT.md src/lib/akisuite-catalogue.ts tests/akisuite-catalogue.test.ts src/lib/akisuite-stripe.ts tests/akisuite-stripe.test.ts tests/stripe.test.ts tests/akisuite-webhook-contract.test.ts tests/akisuite-membership-ui.test.ts tests/akisuite-membership-hub.test.ts src/components/AkiSuiteMembershipGrid.tsx src/components/AkiSuiteMembershipGrid.module.css src/components/AkiSuiteMembershipHub.tsx src/components/AkiSuiteMembershipHub.module.css 'src/app/[locale]/account/membership/page.tsx' 'src/app/[locale]/account/memberships/page.tsx' 'src/app/[locale]/membership/page.tsx' 'src/app/[locale]/account/subscription/page.tsx' tests/akisuite-checkout.test.ts 'src/app/[locale]/account/subscription/akisuite-actions.ts' src/app/api/stripe/webhook/route.ts tests/business-growth-overview.test.ts tests/e2e/business-packages.spec.ts tests/e2e/discovery.spec.ts src/components/BusinessGrowthOverview.tsx src/components/BusinessGrowthOverview.module.css src/app/akiduermo/account/page.tsx src/app/akiduermo/account/account.module.css tests/akiduermo-filters.test.tsx 'src/app/[locale]/business/page.tsx' src/app/akiduermo/membership/page.tsx src/app/akiduermo/membership/membership.module.css src/middleware.ts tests/akisuite-premium-launch.test.ts tests/akiduermo-membership.test.ts scripts/test-account-browser.mjs tests/akisuite-membership-render.test.tsx tests/akisuite-routing.test.ts tests/account-unavailable.test.tsx src/lib/akiduermo-routing.ts
      - name: Commit formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --update
            git commit -m "style: format master contract docs and scripts"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
