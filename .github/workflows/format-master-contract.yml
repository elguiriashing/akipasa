name: Format master documentation PR
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Format documentation and scripts
        run: npx prettier --write AGENTS.md docs/AKIPASA_MASTER.md docs/CHANGE_IMPACT_REGISTER.md docs/SOURCE_ROUTE_BASELINE.md scripts/generate-system-inventory.mjs scripts/check-change-contract.mjs "custom-worker.ts" "package.json" "src/app/[locale]/account/saved/actions.ts" "src/app/[locale]/account/saved/page.tsx" "src/app/[locale]/business/actions.ts" "src/app/[locale]/events/[slug]/book/actions.ts" "src/app/[locale]/events/[slug]/book/page.tsx" "src/app/[locale]/layout.tsx" "src/app/akiduermo/account/page.tsx" "src/app/akiduermo/bookings/page.tsx" "src/app/akiduermo/page.tsx" "src/app/akiduermo/saved/page.tsx" "src/app/akiduermo/settings/page.tsx" "src/app/api/stays/saved/route.ts" "src/components/AkiDuermo.module.css" "src/components/AkiDuermo.tsx" "src/lib/akiduermo-routing.ts" "src/lib/booking-confirmation-email.ts" "src/lib/booking-mail-delivery.ts" "src/lib/claim-decision-email.ts" "src/lib/claim-submission-alert.ts" "src/lib/suite-email-templates.ts" "src/lib/suite-mail-delivery.ts" "src/lib/suite-welcome.ts" "tests/claim-decision-email.test.ts" "tests/claim-submission-alerts.test.ts" "tests/suite-email-contract.test.ts" "tests/suite-email-templates.test.ts" "tests/suite-mail-delivery.test.ts" "docs/ARCHITECTURE.md"
      - name: Commit formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add AGENTS.md docs/AKIPASA_MASTER.md docs/CHANGE_IMPACT_REGISTER.md docs/SOURCE_ROUTE_BASELINE.md scripts/generate-system-inventory.mjs scripts/check-change-contract.mjs "custom-worker.ts" "package.json" "src/app/[locale]/account/saved/actions.ts" "src/app/[locale]/account/saved/page.tsx" "src/app/[locale]/business/actions.ts" "src/app/[locale]/events/[slug]/book/actions.ts" "src/app/[locale]/events/[slug]/book/page.tsx" "src/app/[locale]/layout.tsx" "src/app/akiduermo/account/page.tsx" "src/app/akiduermo/bookings/page.tsx" "src/app/akiduermo/page.tsx" "src/app/akiduermo/saved/page.tsx" "src/app/akiduermo/settings/page.tsx" "src/app/api/stays/saved/route.ts" "src/components/AkiDuermo.module.css" "src/components/AkiDuermo.tsx" "src/lib/akiduermo-routing.ts" "src/lib/booking-confirmation-email.ts" "src/lib/booking-mail-delivery.ts" "src/lib/claim-decision-email.ts" "src/lib/claim-submission-alert.ts" "src/lib/suite-email-templates.ts" "src/lib/suite-mail-delivery.ts" "src/lib/suite-welcome.ts" "tests/claim-decision-email.test.ts" "tests/claim-submission-alerts.test.ts" "tests/suite-email-contract.test.ts" "tests/suite-email-templates.test.ts" "tests/suite-mail-delivery.test.ts" "docs/ARCHITECTURE.md"
            git commit -m "style: format master contract docs and scripts"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
