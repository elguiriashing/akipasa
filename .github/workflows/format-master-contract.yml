name: Format master documentation PR
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Format documentation and scripts
        run: npx prettier --write AGENTS.md docs/AKIPASA_MASTER.md docs/CHANGE_IMPACT_REGISTER.md docs/SOURCE_ROUTE_BASELINE.md scripts/generate-system-inventory.mjs scripts/check-change-contract.mjs
      - name: Commit formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add AGENTS.md docs/AKIPASA_MASTER.md docs/CHANGE_IMPACT_REGISTER.md docs/SOURCE_ROUTE_BASELINE.md scripts/generate-system-inventory.mjs scripts/check-change-contract.mjs
            git commit -m "style: format master contract docs and scripts"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
