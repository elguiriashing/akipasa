name: Format master documentation PR
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - AGENTS.md
      - docs/AKIPASA_MASTER.md
      - docs/CHANGE_IMPACT_REGISTER.md
      - scripts/generate-system-inventory.mjs
      - scripts/check-change-contract.mjs
      - .github/workflows/master-system-contract.yml
      - .github/workflows/format-master-contract.yml
permissions:
  contents: write
jobs:
  format:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Format contract files
        run: npx prettier --write AGENTS.md docs/AKIPASA_MASTER.md docs/CHANGE_IMPACT_REGISTER.md docs/SOURCE_ROUTE_BASELINE.md scripts/generate-system-inventory.mjs scripts/check-change-contract.mjs
      - name: Print expected formatted workflow\n        run: |\n          npx prettier .github/workflows/master-system-contract.yml\n          npx prettier .github/workflows/format-master-contract.yml\n      - name: Commit formatting only if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add AGENTS.md docs/AKIPASA_MASTER.md docs/CHANGE_IMPACT_REGISTER.md scripts/generate-system-inventory.mjs scripts/check-change-contract.mjs .github/workflows/master-system-contract.yml .github/workflows/format-master-contract.yml
            git commit -m "style: format master system contract files"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
